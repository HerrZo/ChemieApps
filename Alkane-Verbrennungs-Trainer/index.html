<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkane-Verbrennung - Chemie Lern-App</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        chem: {
                            50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
                            400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c',
                            800: '#9a3412', 900: '#7c2d12'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .sub { vertical-align: sub; font-size: 0.75em; }
        @keyframes pulse-highlight {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); background-color: #fed7aa; }
        }
        .animate-highlight { animation: pulse-highlight 0.6s ease-in-out; }
        /* Dark Mode */
        html.dark body { background: linear-gradient(135deg, #1a1208 0%, #1f1510 50%, #251a0e 100%) !important; color: #f1f5f9; }
        html.dark .bg-white { background-color: #1e1812 !important; }
        html.dark .bg-chem-50, html.dark .bg-chem-100 { background-color: #2d2418 !important; }
        html.dark .bg-slate-50, html.dark .bg-slate-100 { background-color: #252019 !important; }
        html.dark .bg-slate-200 { background-color: #2d2820 !important; }
        html.dark .bg-slate-900 { background-color: #0f0a05 !important; }
        html.dark .text-slate-800, html.dark .text-slate-900 { color: #f1f5f9 !important; }
        html.dark .text-slate-700 { color: #e2e8f0 !important; }
        html.dark .text-slate-600 { color: #cbd5e1 !important; }
        html.dark .text-slate-500, html.dark .text-slate-400 { color: #94a3b8 !important; }
        html.dark .border-chem-100, html.dark .border-chem-200 { border-color: #3d3020 !important; }
        html.dark .border-slate-100, html.dark .border-slate-200 { border-color: #2d2418 !important; }
        html.dark select { background-color: #2d2418 !important; color: #f1f5f9 !important; border-color: #4d3a28 !important; }
        html.dark input[type=text] { background-color: #0f0a05 !important; color: #f1f5f9 !important; border-color: #4d3a28 !important; }
        html.dark .bg-amber-100 { background-color: #451a03 !important; }
        html.dark .text-amber-700 { color: #fbbf24 !important; }
        html.dark .bg-yellow-100 { background-color: #422006 !important; }
        html.dark .text-yellow-700 { color: #fcd34d !important; }
        html.dark .bg-green-100 { background-color: #052e16 !important; }
        html.dark .text-green-700 { color: #34d399 !important; }
        html.dark .border-green-200 { border-color: #065f46 !important; }
        html.dark .bg-red-50 { background-color: #2d0a0a !important; }
        html.dark .text-red-600 { color: #f87171 !important; }
        html.dark .border-red-100 { border-color: #7f1d1d !important; }
        html.dark footer { background-color: rgba(30,24,18,0.8) !important; border-color: #3d3020 !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-chem-50 to-chem-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Constants
        const ALKANE_NAMES = ["", "Methan", "Ethan", "Propan", "Butan", "Pentan", "Hexan", "Heptan", "Oktan", "Nonan", "Decan", "Undecan", "Dodecan"];
        const getAlkaneFormula = (n) => ({ c: n, h: 2 * n + 2 });

        // Icons
        const FlameIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.5 3.5 6.5 1.5 2 2 4.5 2 6.5a7 7 0 1 1-14 0c0-3 2.5-5.5 5-7.5l.5 2.5Z"/>
            </svg>
        );

        const CheckIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        );

        const ArrowIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        );

        // Formula Renderer
        const Formula = ({ c, h, name }) => (
            <span className="font-mono font-bold">
                C<span className="sub">{c}</span>H<span className="sub">{h}</span>
                {name && <span className="ml-2 font-sans font-normal text-sm text-slate-500">({name})</span>}
            </span>
        );

        // Coefficient Box
        const CoeffBox = ({ value, active, animate }) => (
            <div className={`w-12 h-12 sm:w-14 sm:h-14 rounded-xl border-2 flex items-center justify-center text-xl sm:text-2xl font-bold transition-all duration-300
                ${active ? 'border-chem-500 bg-chem-100 shadow-lg scale-110' : 'border-chem-200 bg-white'}
                ${animate ? 'animate-highlight' : ''}`}>
                {value}
            </div>
        );

        // Guide Component
        const GuideComponent = ({ n, setN }) => {
            const [step, setStep] = useState(0);
            const [isDoubling, setIsDoubling] = useState(false);

            const alkan = getAlkaneFormula(n);
            const co2 = n;
            const h2o = n + 1;
            const oTotal = (2 * co2) + h2o;
            const o2 = oTotal / 2;
            const isFraction = oTotal % 2 !== 0;

            const nextStep = () => setStep(s => Math.min(s + 1, 5));
            const prevStep = () => setStep(s => Math.max(s - 1, 0));
            
            useEffect(() => { setStep(0); }, [n]);

            const handleDouble = () => {
                setIsDoubling(true);
                setTimeout(() => {
                    setIsDoubling(false);
                    setStep(5);
                }, 600);
            };

            const stepTitles = ["Grundgerüst", "C-Atome ausgleichen", "H-Atome ausgleichen", "Sauerstoff zählen", "Sauerstoff anpassen", "Fertig!"];

            return (
                <div className="space-y-6">
                    {/* Alkan Selector */}
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 bg-white rounded-xl shadow-sm border border-chem-100">
                        <div className="flex items-center gap-3">
                            <label className="text-sm font-semibold text-chem-800">Alkan wählen:</label>
                            <select 
                                value={n} 
                                onChange={(e) => setN(parseInt(e.target.value))}
                                className="px-3 py-2 bg-white border border-chem-200 rounded-lg shadow-sm focus:ring-2 focus:ring-chem-400 outline-none text-sm"
                            >
                                {ALKANE_NAMES.slice(1).map((name, i) => (
                                    <option key={name} value={i + 1}>{name} (C{i+1})</option>
                                ))}
                            </select>
                        </div>
                        <div className="text-sm font-medium text-chem-600 bg-chem-50 px-3 py-1 rounded-full">
                            {n} C-Atome · {n % 2 === 0 ? "Gerade" : "Ungerade"}
                        </div>
                    </div>

                    {/* Reaction Display */}
                    <div className={`relative flex flex-wrap items-center justify-center gap-3 sm:gap-4 p-6 bg-white rounded-2xl shadow-inner border-2 border-dashed border-chem-200 transition-all duration-500 ${isDoubling ? 'scale-105' : ''}`}>
                        <div className="flex flex-col items-center gap-2">
                            <CoeffBox value={step >= 5 ? 2 : 1} active={step >= 4 && isFraction && !isDoubling} animate={isDoubling} />
                            <Formula c={alkan.c} h={alkan.h} name={ALKANE_NAMES[n]} />
                        </div>
                        <span className="text-2xl text-slate-300 font-bold">+</span>
                        <div className="flex flex-col items-center gap-2">
                            <CoeffBox value={step < 3 ? "?" : (step === 3 || step === 4 ? o2 : oTotal)} active={step === 3 || (step === 4 && isFraction)} animate={isDoubling} />
                            <span className="font-mono font-bold">O<span className="sub">2</span></span>
                        </div>
                        <div className="text-chem-400"><ArrowIcon /></div>
                        <div className="flex flex-col items-center gap-2">
                            <CoeffBox value={step < 1 ? "?" : (step >= 5 ? co2 * 2 : co2)} active={step === 1} animate={isDoubling} />
                            <span className="font-mono font-bold">CO<span className="sub">2</span></span>
                        </div>
                        <span className="text-2xl text-slate-300 font-bold">+</span>
                        <div className="flex flex-col items-center gap-2">
                            <CoeffBox value={step < 2 ? "?" : (step >= 5 ? h2o * 2 : h2o)} active={step === 2} animate={isDoubling} />
                            <span className="font-mono font-bold">H<span className="sub">2</span>O</span>
                        </div>
                    </div>

                    {/* Step Explanation */}
                    <div className="bg-white rounded-xl p-5 shadow-sm border border-chem-100">
                        <h3 className="text-chem-600 font-bold mb-3 flex items-center gap-2">
                            <span className="w-8 h-8 bg-chem-100 rounded-full flex items-center justify-center text-sm">{step + 1}</span>
                            Schritt {step + 1}: {stepTitles[step]}
                        </h3>
                        <p className="text-slate-600 text-sm sm:text-base leading-relaxed">
                            {step === 0 && `Verbrennung von ${ALKANE_NAMES[n]}. Produkte: Kohlendioxid (CO₂) und Wasser (H₂O).`}
                            {step === 1 && `Links sind ${n} C-Atome. Wir benötigen also ${n} Moleküle CO₂.`}
                            {step === 2 && `Links sind ${alkan.h} H-Atome. Da Wasser 2 H hat, brauchen wir ${h2o} Moleküle H₂O.`}
                            {step === 3 && `Rechts haben wir nun insgesamt ${oTotal} O-Atome (${2 * co2} aus CO₂ + ${h2o} aus H₂O).`}
                            {step === 4 && (isFraction ? 
                                `Das ergibt ${o2} O₂-Moleküle. Da es keine "halben" Moleküle gibt, müssen wir alles verdoppeln!` :
                                `Das ergibt genau ${o2} O₂-Moleküle. Die Gleichung geht auf.`)}
                            {step === 5 && `Die Gleichung ist nun stöchiometrisch korrekt ausgeglichen!`}
                        </p>
                        
                        <div className="flex justify-between items-center mt-5 pt-4 border-t border-slate-100">
                            <button onClick={prevStep} disabled={step === 0} 
                                className="px-4 py-2 text-slate-500 disabled:opacity-30 hover:bg-slate-50 rounded-lg text-sm font-medium transition">
                                Zurück
                            </button>
                            {step === 4 && isFraction ? (
                                <button onClick={handleDouble} 
                                    className="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg flex items-center gap-2 transition">
                                    <FlameIcon /> Alles verdoppeln! (×2)
                                </button>
                            ) : step < 5 ? (
                                <button onClick={nextStep} 
                                    className="bg-chem-500 hover:bg-chem-600 text-white px-6 py-2 rounded-lg font-bold shadow-md transition">
                                    Weiter
                                </button>
                            ) : (
                                <button onClick={() => setStep(0)} 
                                    className="text-chem-500 font-medium hover:underline text-sm">
                                    Neu starten
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // localStorage helpers for Trainer
        const loadTrainerStats = () => {
            try {
                const saved = localStorage.getItem('alkaneTrainerStats');
                return saved ? JSON.parse(saved) : { solved: 0, total: 0, highScore: 0 };
            } catch { return { solved: 0, total: 0, highScore: 0 }; }
        };
        const saveTrainerStats = (stats) => {
            try { localStorage.setItem('alkaneTrainerStats', JSON.stringify(stats)); } catch {}
        };

        // Trainer Component
        const TrainerComponent = () => {
            const [problem, setProblem] = useState(null);
            const [inputs, setInputs] = useState({ a: '', b: '', c: '', d: '' });
            const [feedback, setFeedback] = useState(null);
            const [stats, setStats] = useState(() => loadTrainerStats());
            const [streak, setStreak] = useState(0);

            const generateTask = useCallback(() => {
                const n = Math.floor(Math.random() * 12) + 1;
                const alkan = getAlkaneFormula(n);
                const co2 = n;
                const h2o = n + 1;
                const oTotal = (2 * co2) + h2o;
                const solution = oTotal % 2 === 0
                    ? { a: 1, b: oTotal / 2, c: co2, d: h2o }
                    : { a: 2, b: oTotal, c: co2 * 2, d: h2o * 2 };
                setProblem({ n, alkan, solution });
                setInputs({ a: '', b: '', c: '', d: '' });
                setFeedback(null);
            }, []);

            useEffect(() => { generateTask(); }, [generateTask]);

            const checkSolution = () => {
                if (!problem) return;
                const isCorrect =
                    (parseInt(inputs.a) || 1) === problem.solution.a &&
                    (parseFloat(inputs.b) || 0) === problem.solution.b &&
                    (parseInt(inputs.c) || 0) === problem.solution.c &&
                    (parseInt(inputs.d) || 0) === problem.solution.d;

                setFeedback(isCorrect ? 'correct' : 'wrong');
                const newStreak = isCorrect ? streak + 1 : 0;
                setStreak(newStreak);
                setStats(prev => {
                    const newSolved = prev.solved + (isCorrect ? 1 : 0);
                    const newTotal = prev.total + 1;
                    const newHighScore = Math.max(prev.highScore || 0, newSolved);
                    const next = { solved: newSolved, total: newTotal, highScore: newHighScore };
                    saveTrainerStats(next);
                    return next;
                });
            };

            const resetStats = () => {
                const reset = { solved: 0, total: 0, highScore: stats.highScore };
                setStats(reset);
                saveTrainerStats(reset);
                setStreak(0);
                generateTask();
            };

            if (!problem) return null;

            const leftC = (parseInt(inputs.a) || 1) * problem.alkan.c;
            const rightC = parseInt(inputs.c) || 0;
            const leftH = (parseInt(inputs.a) || 1) * problem.alkan.h;
            const rightH = (parseInt(inputs.d) || 0) * 2;
            const leftO = (parseFloat(inputs.b) || 0) * 2;
            const rightO = ((parseInt(inputs.c) || 0) * 2) + (parseInt(inputs.d) || 0);

            const InputBox = ({ value, onChange, placeholder = "?", ariaLabel }) => (
                <input
                    type="text"
                    value={value}
                    onChange={onChange}
                    placeholder={placeholder}
                    aria-label={ariaLabel}
                    className="w-12 h-12 sm:w-14 sm:h-14 bg-slate-800 border-2 border-slate-600 rounded-xl text-center text-xl font-bold text-white focus:border-chem-400 outline-none transition"
                />
            );

            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap justify-between items-center gap-2">
                        <h2 className="text-lg sm:text-xl font-bold text-slate-700">Setze die Koeffizienten:</h2>
                        <div className="flex items-center gap-2 flex-wrap">
                            {streak >= 2 && (
                                <div className="px-3 py-1 bg-amber-100 rounded-full text-sm font-bold text-amber-700" aria-live="polite" aria-label={`Streak: ${streak} in Folge richtig`}>
                                    🔥 {streak}er Streak!
                                </div>
                            )}
                            <div className="px-3 py-1 bg-chem-100 rounded-full text-sm font-medium text-chem-700" aria-label={`Score: ${stats.solved} von ${stats.total} richtig`}>
                                Score: {stats.solved}/{stats.total}
                            </div>
                            {stats.highScore > 0 && (
                                <div className="px-3 py-1 bg-yellow-100 rounded-full text-sm font-medium text-yellow-700" aria-label={`Highscore: ${stats.highScore}`}>
                                    🏆 {stats.highScore}
                                </div>
                            )}
                            <button onClick={resetStats} aria-label="Score zurücksetzen und neue Aufgabe starten"
                                className="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full text-sm font-medium transition">
                                Reset
                            </button>
                        </div>
                    </div>

                    {/* Reaction Input */}
                    <div className="flex flex-wrap items-center justify-center gap-3 sm:gap-4 p-6 sm:p-8 bg-slate-900 text-white rounded-2xl shadow-xl">
                        <div className="flex items-center gap-2">
                            <InputBox value={inputs.a} onChange={e => setInputs({...inputs, a: e.target.value})} placeholder="1" ariaLabel="Koeffizient vor dem Alkan" />
                            <Formula c={problem.alkan.c} h={problem.alkan.h} name={ALKANE_NAMES[problem.n]} />
                        </div>
                        <span className="text-xl text-slate-400" aria-hidden="true">+</span>
                        <div className="flex items-center gap-2">
                            <InputBox value={inputs.b} onChange={e => setInputs({...inputs, b: e.target.value})} ariaLabel="Koeffizient vor O₂" />
                            <span className="font-mono font-bold">O<span className="sub">2</span></span>
                        </div>
                        <div className="text-chem-400" aria-hidden="true"><ArrowIcon /></div>
                        <div className="flex items-center gap-2">
                            <InputBox value={inputs.c} onChange={e => setInputs({...inputs, c: e.target.value})} ariaLabel="Koeffizient vor CO₂" />
                            <span className="font-mono font-bold">CO<span className="sub">2</span></span>
                        </div>
                        <span className="text-xl text-slate-400" aria-hidden="true">+</span>
                        <div className="flex items-center gap-2">
                            <InputBox value={inputs.d} onChange={e => setInputs({...inputs, d: e.target.value})} ariaLabel="Koeffizient vor H₂O" />
                            <span className="font-mono font-bold">H<span className="sub">2</span>O</span>
                        </div>
                    </div>

                    {/* Atom Balance */}
                    <div className="grid grid-cols-3 gap-2 max-w-xs mx-auto text-center text-sm" aria-label="Atombilanz">
                        <div className="font-bold text-slate-400 uppercase">Atom</div>
                        <div className="font-bold text-slate-400 uppercase">Links</div>
                        <div className="font-bold text-slate-400 uppercase">Rechts</div>

                        <div className="flex justify-center"><div className="w-6 h-6 rounded-full bg-slate-700 text-white flex items-center justify-center text-xs font-bold" aria-label="Kohlenstoff">C</div></div>
                        <div className={`font-mono font-bold ${leftC === rightC && leftC > 0 ? 'text-green-500' : 'text-slate-400'}`}>{leftC}</div>
                        <div className={`font-mono font-bold ${leftC === rightC && leftC > 0 ? 'text-green-500' : 'text-slate-400'}`}>{rightC}</div>

                        <div className="flex justify-center"><div className="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs font-bold" aria-label="Wasserstoff">H</div></div>
                        <div className={`font-mono font-bold ${leftH === rightH && leftH > 0 ? 'text-green-500' : 'text-slate-400'}`}>{leftH}</div>
                        <div className={`font-mono font-bold ${leftH === rightH && leftH > 0 ? 'text-green-500' : 'text-slate-400'}`}>{rightH}</div>

                        <div className="flex justify-center"><div className="w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center text-xs font-bold" aria-label="Sauerstoff">O</div></div>
                        <div className={`font-mono font-bold ${leftO === rightO && leftO > 0 ? 'text-green-500' : 'text-slate-400'}`}>{leftO}</div>
                        <div className={`font-mono font-bold ${leftO === rightO && leftO > 0 ? 'text-green-500' : 'text-slate-400'}`}>{rightO}</div>
                    </div>

                    {/* Feedback & Actions */}
                    <div className="flex flex-col items-center gap-4">
                        {feedback === 'correct' && (
                            <div className="p-3 bg-green-100 text-green-700 rounded-xl border border-green-200 flex items-center gap-2" role="status" aria-live="polite">
                                <CheckIcon /> Super! Richtig ausgeglichen.
                            </div>
                        )}
                        {feedback === 'wrong' && (
                            <div className="p-3 bg-red-50 text-red-600 rounded-xl border border-red-100 text-sm" role="alert" aria-live="assertive">
                                Prüfe die Atombilanz. Nicht alle Atome stimmen überein.
                            </div>
                        )}
                        <div className="flex gap-3">
                            <button onClick={checkSolution} aria-label="Lösung prüfen"
                                className="bg-chem-500 hover:bg-chem-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition">
                                Prüfen
                            </button>
                            <button onClick={generateTask} aria-label="Neue zufällige Aufgabe laden"
                                className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3 rounded-xl font-bold transition">
                                Neue Aufgabe
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App
        const App = () => {
            const [darkMode, setDarkMode] = React.useState(() => localStorage.getItem('chemDarkMode') === 'true');
            React.useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
                localStorage.setItem('chemDarkMode', darkMode);
            }, [darkMode]);
            const [mode, setMode] = useState('guide');
            const [carbonCount, setCarbonCount] = useState(3);

            return (
                <div className="min-h-screen flex flex-col">
                    <div className="flex-grow max-w-4xl mx-auto w-full p-4 sm:p-6 lg:p-8">
                        {/* Header */}
                        <header className="mb-6 text-center">
                            <div style={{position:'fixed', top:'1rem', right:'1rem', zIndex:50}}>
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    aria-label={darkMode ? 'Light Mode aktivieren' : 'Dark Mode aktivieren'}
                                    className="w-10 h-10 rounded-full bg-chem-100 dark:bg-chem-900 text-chem-700 dark:text-chem-300 border border-chem-200 dark:border-chem-700 shadow-md hover:shadow-lg transition-all flex items-center justify-center">
                                    {darkMode ? '☀️' : '🌙'}
                                </button>
                            </div>
                            <a href="../index.html" className="inline-block mb-4 text-sm text-chem-600 hover:text-chem-700 transition">
                                ← Zurück zur Übersicht
                            </a>
                            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-800 flex items-center justify-center gap-2">
                                🔥 <span className="text-chem-600">Alkan-Verbrennung</span>
                            </h1>
                            <p className="text-slate-500 mt-2 text-sm">Lerne das Ausgleichen von Verbrennungsreaktionen</p>
                            
                            {/* Mode Toggle */}
                            <div className="inline-flex mt-4 p-1 bg-slate-200 rounded-xl shadow-inner" role="group" aria-label="Modus auswählen">
                                <button onClick={() => setMode('guide')}
                                    aria-label="Schritt-für-Schritt Anleitung"
                                    aria-pressed={mode === 'guide'}
                                    className={`px-5 py-2 rounded-lg font-bold text-sm transition-all ${mode === 'guide' ? 'bg-white text-chem-600 shadow' : 'text-slate-500 hover:text-slate-700'}`}>
                                    📖 Guide
                                </button>
                                <button onClick={() => setMode('trainer')}
                                    aria-label="Trainer-Modus: Koeffizienten selbst eingeben"
                                    aria-pressed={mode === 'trainer'}
                                    className={`px-5 py-2 rounded-lg font-bold text-sm transition-all ${mode === 'trainer' ? 'bg-white text-chem-600 shadow' : 'text-slate-500 hover:text-slate-700'}`}>
                                    🎯 Trainer
                                </button>
                            </div>
                        </header>

                        {/* Main Content */}
                        <main className="bg-white rounded-2xl shadow-xl p-5 sm:p-8 border border-slate-100">
                            {mode === 'guide' ? <GuideComponent n={carbonCount} setN={setCarbonCount} /> : <TrainerComponent />}
                        </main>
                    </div>

                    {/* Footer */}
                    <footer className="w-full py-4 border-t border-chem-200 bg-white/50 mt-auto">
                        <div className="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400">
                            <span className="font-medium">Johannes-Scharrer-Gymnasium</span> · Zollfrank
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
