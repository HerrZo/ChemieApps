name: Deploy to GitHub Pages
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build all apps
        run: |
          for app in ZMWW Wechselwirkungen Gasreaktionen Alkane-Verbrennungs-Trainer "Molekülpolarität"; do
            cd "$app"
            npm install
            npm run build
            cd ..
          done
      - name: Assemble dist
        run: |
          mkdir -p dist
          cp index.html dist/
          declare -A SLUG_MAP=(
            ["ZMWW"]="zmww"
            ["Wechselwirkungen"]="wechselwirkungen"
            ["Gasreaktionen"]="gasreaktionen"
            ["Alkane-Verbrennungs-Trainer"]="alkane-verbrennungs-trainer"
            ["Molekülpolarität"]="molekulpolaritat"
          )
          for app in "ZMWW" "Wechselwirkungen" "Gasreaktionen" "Alkane-Verbrennungs-Trainer" "Molekülpolarität"; do
            slug="${SLUG_MAP[$app]}"
            cp -r "$app/dist" "dist/$slug"
          done
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
