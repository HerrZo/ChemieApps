<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasreaktionen - Chemie Lern-App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        chem: {
                            50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
                            400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c',
                            800: '#9a3412', 900: '#7c2d12'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #f97316; margin-top: -8px; cursor: pointer; box-shadow: 0 2px 6px rgba(249, 115, 22, 0.4); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #fed7aa; border-radius: 2px; }
        html.dark body { background: linear-gradient(135deg, #1a1208 0%, #1f1510 50%, #251a0e 100%) !important; color: #f1f5f9; }
        html.dark .bg-white { background-color: #1e1812 !important; }
        html.dark .bg-chem-50, html.dark .bg-chem-100 { background-color: #2d2418 !important; }
        html.dark .bg-slate-50, html.dark .bg-slate-100 { background-color: #252019 !important; }
        html.dark .bg-slate-800, html.dark .bg-slate-900 { background-color: #0f0a05 !important; }
        html.dark .text-slate-800, html.dark .text-slate-900 { color: #f1f5f9 !important; }
        html.dark .text-slate-700 { color: #e2e8f0 !important; }
        html.dark .text-slate-600 { color: #cbd5e1 !important; }
        html.dark .text-slate-500, html.dark .text-slate-400 { color: #94a3b8 !important; }
        html.dark .text-chem-800 { color: #fdba74 !important; }
        html.dark .border-chem-100, html.dark .border-chem-200 { border-color: #3d3020 !important; }
        html.dark .border-slate-100, html.dark .border-slate-200 { border-color: #2d2418 !important; }
        html.dark input[type=range]::-webkit-slider-runnable-track { background: #4d3a28 !important; }
        html.dark .bg-green-50 { background-color: #052e16 !important; }
        html.dark .text-green-700 { color: #34d399 !important; }
        html.dark .border-green-100 { border-color: #065f46 !important; }
        html.dark .bg-red-50 { background-color: #2d0a0a !important; }
        html.dark .text-red-700 { color: #f87171 !important; }
        html.dark .border-red-100 { border-color: #7f1d1d !important; }
        html.dark input[type=checkbox] { accent-color: #f97316; }
        html.dark footer { background-color: rgba(30,24,18,0.8) !important; border-color: #3d3020 !important; }
        html.dark .border-chem-200.bg-white { background-color: #252019 !important; border-color: #4d3a28 !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-chem-50 to-chem-100 min-h-screen text-slate-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
