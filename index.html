<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemie Lern-Apps</title>
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        chem: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fed7aa 100%);
            min-height: 100vh;
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -15px rgba(234, 88, 12, 0.25);
        }
        .filter-btn {
            transition: all 0.2s ease;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }
        .app-card {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .app-card:nth-child(1) { animation-delay: 0.1s; }
        .app-card:nth-child(2) { animation-delay: 0.15s; }
        .app-card:nth-child(3) { animation-delay: 0.2s; }
        .app-card:nth-child(4) { animation-delay: 0.25s; }
        .app-card:nth-child(5) { animation-delay: 0.3s; }
        .app-card:nth-child(6) { animation-delay: 0.35s; }
        .badge {
            background: linear-gradient(135deg, #f97316, #ea580c);
        }
        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.3);
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="pt-12 pb-8 px-4 sm:px-6 text-center">
            <div class="max-w-4xl mx-auto">
                <span class="inline-block py-1.5 px-4 rounded-full bg-chem-100 text-chem-900 text-xs font-semibold tracking-wide uppercase mb-4 shadow-sm border border-chem-200">
                    Johannes-Scharrer-Gymnasium
                </span>
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight text-slate-900 mb-4">
                    Chemie Lern-Apps
                </h1>
                <p class="text-base sm:text-lg text-slate-600 max-w-2xl mx-auto font-light leading-relaxed">
                    Interaktive Werkzeuge und Visualisierungen zum Verständnis chemischer Prozesse.
                </p>
            </div>
        </header>

        <!-- Search & Filter -->
        <div class="sticky top-0 z-50 px-4 sm:px-6 mb-8 bg-gradient-to-b from-chem-50 via-chem-50 to-transparent pb-4 pt-2">
            <div class="max-w-4xl mx-auto space-y-4">
                <!-- Search -->
                <div class="relative">
                    <input 
                        type="text" 
                        id="search-input"
                        placeholder="Apps durchsuchen..."
                        class="search-input w-full px-4 py-3 pl-12 bg-white/90 backdrop-blur-md rounded-2xl shadow-lg border border-slate-200/50 outline-none text-slate-700 placeholder-slate-400 transition-all"
                    >
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                
                <!-- Filter -->
                <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-lg border border-slate-200/50 p-2 overflow-x-auto">
                    <div class="flex space-x-2 min-w-max" id="filter-container"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-grow px-4 sm:px-6 pb-16">
            <div class="max-w-6xl mx-auto" id="app-grid-container"></div>
        </main>

        <!-- Footer -->
        <footer class="w-full py-6 border-t border-slate-200 bg-white/70 backdrop-blur-sm mt-auto">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="text-sm text-slate-500 text-center sm:text-left">
                    <span class="font-medium">Johannes-Scharrer-Gymnasium</span> · Zollfrank
                </div>
                <div class="text-sm text-slate-400">
                    © <span id="year"></span> Chemie Lern-Apps
                </div>
            </div>
        </footer>
    </div>

    <script>
        // Configuration
        const categories = ['Alle', 'Chemie 9', 'Chemie 10', 'Chemie 12', 'Chemie 13'];

        const projects = [
            {
                id: 'c9-Molpol',
                title: "Molekülpolarität",
                description: "Interaktiver Explorer für Bindungstypen, Dipole und Molekülgeometrien",
                link: "Molekülpolarität/index.html",
                tag: "Chemie 9",
                icon: 'atom',
                keywords: ['polarität', 'dipol', 'bindung', 'elektronegativität']
            },
            {
                id: 'c10-zmww',
                title: "Zwischenmolekulare Wechselwirkungen",
                description: "Lerne London-Kräfte, Dipol-Dipol und Wasserstoffbrücken kennen",
                link: "ZMWW/index.html",
                tag: "Chemie 10",
                icon: 'atom',
                keywords: ['zmww', 'london', 'wasserstoffbrücken', 'siedepunkt']
            },
            {
                id: 'c9-gasgesetze',
                title: "Gasreaktionen",
                description: "Verstehe das Gesetz von Avogadro und Volumenverhältnisse",
                link: "Gasreaktionen/index.html",
                tag: "Chemie 9",
                icon: 'flask',
                keywords: ['gas', 'avogadro', 'volumen', 'reaktion']
            },
            {
                id: 'c9-AlkVerbr',
                title: "Alkane-Verbrennung",
                description: "Übe das Ausgleichen von Verbrennungsreaktionen schrittweise",
                link: "Alkane-Verbrennungs-Trainer/index.html",
                tag: "Chemie 9",
                icon: 'fire',
                keywords: ['alkane', 'verbrennung', 'stöchiometrie', 'ausgleichen']
            },
            {
                id: 'c10-alkanes',
                title: "Wechselwirkungen",
                description: "Erkunde intermolekulare Kräfte und ihre Auswirkungen",
                link: "Wechselwirkungen/index.html",
                tag: "Chemie 10",
                icon: 'molecule',
                keywords: ['wechselwirkungen', 'kräfte', 'moleküle']
            },
            {
                id: 'c10-saeurebase',
                title: "Säure-Base-Theorie",
                description: "Interaktives Lernen der Brønsted-Theorie, Protolyse, Ampholyte und Neutralisation",
                link: "Saeure-Base-Trainer/index.html",
                tag: "Chemie 10",
                icon: 'flask',
                keywords: ['säure', 'base', 'brønsted', 'protolyse', 'ampholyt', 'neutralisation', 'ph']
            },
            {
                id: 'c9-ionen-salze',
                title: "Ionen & Salze",
                description: "Ionenbindung, Ionengitter, Verhältnisformeln, Molekülionen und Eigenschaften von Salzen",
                link: "Ionen-und-Salze/index.html",
                tag: "Chemie 9",
                icon: 'atom',
                keywords: ['ionen', 'salze', 'ionenbindung', 'ionengitter', 'verhältnisformel', 'überkreuzregel', 'kation', 'anion']
            }
        ];

        let currentCategory = 'Alle';
        let searchQuery = '';

        // Icons
        function getIconSvg(type) {
            const icons = {
                atom: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 2a10 10 0 0 0-10 10"/><ellipse cx="12" cy="12" rx="10" ry="4"/></svg>`,
                molecule: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><line x1="8.5" y1="7.5" x2="15.5" y2="7.5"/><line x1="8.5" y1="16.5" x2="15.5" y2="16.5"/><line x1="7.5" y1="8.5" x2="7.5" y2="15.5"/><line x1="16.5" y1="8.5" x2="16.5" y2="15.5"/></svg>`,
                flask: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 3h6v4.5l4 8.5a2 2 0 0 1-1.8 3H6.8a2 2 0 0 1-1.8-3l4-8.5V3z"/><line x1="9" y1="3" x2="15" y2="3"/></svg>`,
                fire: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2c0 4-4 6-4 10a4 4 0 0 0 8 0c0-4-4-6-4-10z"/><path d="M12 12c0 2-1.5 3-1.5 4.5a1.5 1.5 0 0 0 3 0c0-1.5-1.5-2.5-1.5-4.5z"/></svg>`,
                magnet: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 3a3 3 0 0 1 0 6h-3"/><path d="M5 3a3 3 0 0 0 0 6h3"/><path d="M16 9v6a4 4 0 0 1-8 0V9"/></svg>`
            };
            return icons[type] || icons.flask;
        }

        // Render filter bar
        function renderFilterBar() {
            const container = document.getElementById('filter-container');
            container.innerHTML = categories.map(cat => `
                <button 
                    onclick="filterByCategory('${cat}')"
                    class="filter-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap ${currentCategory === cat ? 'active' : 'text-slate-600 hover:bg-chem-50'}"
                >
                    ${cat}
                </button>
            `).join('');
        }

        // Filter by category
        function filterByCategory(category) {
            currentCategory = category;
            renderFilterBar();
            renderGrid();
        }

        // Create card HTML
        function createCardHTML(project) {
            return `
                <div class="app-card bg-white rounded-2xl p-5 sm:p-6 border border-slate-100 card-hover flex flex-col h-full">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-chem-50 rounded-xl text-chem-600">
                            ${getIconSvg(project.icon)}
                        </div>
                        <span class="text-xs font-semibold text-chem-700 bg-chem-100 px-3 py-1 rounded-full">
                            ${project.tag}
                        </span>
                    </div>
                    
                    <h3 class="text-lg sm:text-xl font-bold text-slate-800 mb-2">
                        ${project.title}
                    </h3>
                    
                    <p class="text-slate-500 text-sm sm:text-base mb-6 flex-grow leading-relaxed">
                        ${project.description}
                    </p>
                    
                    <a href="${project.link}" 
                       class="inline-flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-white bg-gradient-to-r from-chem-600 to-chem-700 rounded-xl hover:from-chem-700 hover:to-chem-800 transition-all shadow-md hover:shadow-lg group">
                        App öffnen
                        <svg class="w-4 h-4 ml-2 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </a>
                </div>
            `;
        }

        // Render grid
        function renderGrid() {
            const container = document.getElementById('app-grid-container');
            
            let filtered = projects;
            
            // Filter by category
            if (currentCategory !== 'Alle') {
                filtered = filtered.filter(p => p.tag === currentCategory);
            }
            
            // Filter by search
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(p => 
                    p.title.toLowerCase().includes(query) ||
                    p.description.toLowerCase().includes(query) ||
                    p.keywords.some(k => k.includes(query))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p class="text-lg font-medium">Keine Apps gefunden</p>
                        <p class="text-sm mt-1">Versuche eine andere Suche oder Kategorie</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                    ${filtered.map(project => createCardHTML(project)).join('')}
                </div>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            
            // Search functionality
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderGrid();
            });
            
            renderFilterBar();
            renderGrid();
        });
    </script>
</body>

</html>
